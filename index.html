<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAVE༒KINGS | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
}

header{
  background:#111;
  border-bottom:1px solid #292929;
  padding:25px 15px;
  text-align:center;
}

header h1{
  color:#ff6a00;
}

.container{
  width:92%;
  max-width:1100px;
  margin:30px auto;
}

.box{
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  padding:25px;
}

.login-box{
  max-width:500px;
  margin:60px auto;
}

h2{
  margin-bottom:20px;
}

label{
  display:block;
  margin:12px 0 6px;
  color:#ddd;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #333;
  background:#191919;
  color:#fff;
  outline:none;
}

input:focus{
  border-color:#ff6a00;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  background:#ff6a00;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.login-button{
  width:100%;
  margin-top:20px;
}

.error{
  color:#ff6a00;
  margin-top:15px;
  line-height:1.5;
}

.dashboard{
  display:none;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.logout{
  background:#333;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#111;
  border:1px solid #292929;
  border-radius:14px;
  padding:20px;
  text-align:center;
}

.stat-number{
  color:#ff6a00;
  font-size:30px;
  font-weight:bold;
}

.applications{
  display:grid;
  gap:18px;
}

.application{
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  padding:22px;
}

.application h3{
  color:#ff8a00;
  margin-bottom:15px;
}

.application p{
  color:#ccc;
  margin:7px 0;
  word-break:break-word;
}

.status{
  display:inline-block;
  background:#222;
  border-radius:7px;
  padding:7px 10px;
  margin:12px 0;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.approve{
  background:#16803c;
}

.reject{
  background:#a83232;
}

.screenshot{
  display:block;
  max-width:320px;
  max-height:320px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid #333;
}

.loading,
.empty{
  text-align:center;
  color:#888;
  padding:30px;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

  .topbar{
    align-items:stretch;
  }

  .topbar button{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚔️ BRAVE༒KINGS ADMIN</h1>
</header>


<!-- LOGIN -->

<div
  class="container"
  id="loginSection">

  <div class="box login-box">

    <h2>👑 Admin Login</h2>

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      autocomplete="username"
      placeholder="Admin email"
    >

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Admin password"
    >

    <button
      id="loginButton"
      class="login-button"
      onclick="login()">

      LOGIN

    </button>

    <div
      id="loginError"
      class="error">
    </div>

  </div>

</div>


<!-- DASHBOARD -->

<div
  class="dashboard"
  id="dashboard">

  <div class="container">

    <div class="topbar">

      <h2>
        📋 Applications
      </h2>

      <div>

        <button
          onclick="loadApplications()">

          🔄 Refresh

        </button>

        <button
          class="logout"
          onclick="logout()">

          Logout

        </button>

      </div>

    </div>


    <div class="stats">

      <div class="stat">

        <div
          class="stat-number"
          id="total">

          0

        </div>

        <p>Total</p>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="pending">

          0

        </div>

        <p>Pending</p>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="approved">

          0

        </div>

        <p>Approved</p>

      </div>

    </div>


    <div
      class="applications"
      id="applications">

    </div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
"https://enhoicmhdhwksgwlveou.supabase.co";


const SUPABASE_KEY =
"sb_publishable_FhqemTWZw6K5w-vO6bze8g_-hm117f-";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   LOGIN
========================================= */

async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  const errorBox =
    document
      .getElementById("loginError");


  const button =
    document
      .getElementById("loginButton");


  errorBox.textContent = "";


  if(!email || !password){

    errorBox.textContent =
      "Please enter your email and password.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "LOGGING IN...";


  const {
    data,
    error
  } =
  await supabaseClient
    .auth
    .signInWithPassword({

      email:email,

      password:password

    });


  if(error){

    console.error(error);

    errorBox.textContent =
      "Supabase says: " +
      error.message;

    button.disabled = false;

    button.textContent =
      "LOGIN";

    return;
  }


  if(!data.user){

    errorBox.textContent =
      "Login completed, but no user was returned.";

    button.disabled = false;

    button.textContent =
      "LOGIN";

    return;
  }


  await checkAdmin();


  button.disabled = false;

  button.textContent =
    "LOGIN";
}


/* =========================================
   CHECK ADMIN
   USING USER_ID
========================================= */

async function checkAdmin(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient
    .auth
    .getUser();


  if(!user){

    showLogin();

    return false;
  }


  /*
    IMPORTANT:

    Your public.admins table has a
    user_id column connected to
    auth.users.id.

    Therefore we compare:

    admins.user_id
    with
    user.id
  */

  const {
    data:admin,
    error
  } =
  await supabaseClient
    .from("admins")
    .select("*")
    .eq("user_id",user.id)
    .maybeSingle();


  if(error){

    console.error(error);


    alert(
      "Admin check failed:\n\n" +
      error.message
    );


    await supabaseClient
      .auth
      .signOut();


    showLogin();

    return false;
  }


  if(!admin){

    alert(
      "This account is not registered as a BRAVE༒KINGS admin."
    );


    await supabaseClient
      .auth
      .signOut();


    showLogin();

    return false;
  }


  showDashboard();

  return true;
}


/* =========================================
   SHOW LOGIN
========================================= */

function showLogin(){

  document
    .getElementById("loginSection")
    .style.display =
    "block";


  document
    .getElementById("dashboard")
    .style.display =
    "none";
}


/* =========================================
   SHOW DASHBOARD
========================================= */

async function showDashboard(){

  document
    .getElementById("loginSection")
    .style.display =
    "none";


  document
    .getElementById("dashboard")
    .style.display =
    "block";


  await loadApplications();
}


/* =========================================
   LOAD APPLICATIONS
========================================= */

async function loadApplications(){

  const container =
    document
      .getElementById("applications");


  container.innerHTML =
    "<div class='loading'>" +
    "Loading applications..." +
    "</div>";


  const {
    data,
    error
  } =
  await supabaseClient
    .from("applications")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);


    container.innerHTML =
      "<div class='empty'>" +
      "Could not load applications.<br><br>" +
      escapeHtml(error.message) +
      "</div>";


    return;
  }


  const total =
    data.length;


  const pending =
    data.filter(
      item =>
        (item.status || "Pending")
          .toLowerCase() ===
        "pending"
    ).length;


  const approved =
    data.filter(
      item =>
        (item.status || "")
          .toLowerCase() ===
        "approved"
    ).length;


  document
    .getElementById("total")
    .textContent =
    total;


  document
    .getElementById("pending")
    .textContent =
    pending;


  document
    .getElementById("approved")
    .textContent =
    approved;


  if(!data.length){

    container.innerHTML =
      "<div class='empty'>" +
      "No applications yet." +
      "</div>";


    return;
  }


  container.innerHTML = "";


  for(const app of data){

    let screenshotHTML = "";


    if(app.screenshot_url){

      const {
        data:signedData,
        error:signedError
      } =
      await supabaseClient
        .storage
        .from("tryout-screenshots")
        .createSignedUrl(
          app.screenshot_url,
          3600
        );


      if(
        !signedError &&
        signedData
      ){

        screenshotHTML = `

          <p>
            <strong>
              Profile Screenshot:
            </strong>
          </p>

          <a
            href="${escapeHtml(
              signedData.signedUrl
            )}"
            target="_blank">

            <img
              class="screenshot"
              src="${escapeHtml(
                signedData.signedUrl
              )}"
              alt="Player screenshot">

          </a>

        `;
      }
    }


    const card =
      document
        .createElement("div");


    card.className =
      "application";


    card.innerHTML = `

      <h3>
        ⚔️ ${
          escapeHtml(
            app.name ||
            "Unknown"
          )
        }
      </h3>


      <p>
        <strong>
          Application ID:
        </strong>

        ${
          escapeHtml(
            app.application_id ||
            "N/A"
          )
        }
      </p>


      <p>
        <strong>
          UID:
        </strong>

        ${
          escapeHtml(
            app.uid ||
            "N/A"
          )
        }
      </p>


      <p>
        <strong>
          Contact:
        </strong>

        ${
          escapeHtml(
            app.contact ||
            "N/A"
          )
        }
      </p>


      <p>
        <strong>
          Gender:
        </strong>

        ${
          escapeHtml(
            app.gender ||
            "N/A"
          )
        }
      </p>


      <p>
        <strong>
          Role:
        </strong>

        ${
          escapeHtml(
            app.role ||
            "N/A"
          )
        }
      </p>


      <p>
        <strong>
          Rank:
        </strong>

        ${
          escapeHtml(
            app.rank ||
            "N/A"
          )
        }
      </p>


      <p>
        <strong>
          Headshot:
        </strong>

        ${
          escapeHtml(
            app.headshot ||
            "N/A"
          )
        }
      </p>


      <p>
        <strong>
          Reason:
        </strong>

        ${
          escapeHtml(
            app.reason ||
            "N/A"
          )
        }
      </p>


      <div class="status">

        Status:

        <strong>

          ${
            escapeHtml(
              app.status ||
              "Pending"
            )
          }

        </strong>

      </div>


      ${screenshotHTML}


      <div class="actions">

        <button
          class="approve"
          onclick="updateStatus(
            '${escapeHtml(app.id)}',
            'Approved'
          )">

          ✅ APPROVE

        </button>


        <button
          class="reject"
          onclick="updateStatus(
            '${escapeHtml(app.id)}',
            'Rejected'
          )">

          ❌ REJECT

        </button>

      </div>

    `;


    container.appendChild(card);
  }
}


/* =========================================
   UPDATE STATUS
========================================= */

async function updateStatus(
  id,
  status
){

  const {
    error
  } =
  await supabaseClient
    .from("applications")
    .update({
      status:status
    })
    .eq(
      "id",
      id
    );


  if(error){

    console.error(error);


    alert(
      "Could not update application:\n\n" +
      error.message
    );


    return;
  }


  await loadApplications();
}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await supabaseClient
    .auth
    .signOut();


  showLogin();
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================================
   CHECK EXISTING SESSION
========================================= */

supabaseClient
  .auth
  .getSession()
  .then(
    async ({data}) => {

      if(data.session){

        await checkAdmin();

      }else{

        showLogin();

      }

    }
  );

</script>

</body>
</html>
