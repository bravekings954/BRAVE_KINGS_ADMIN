<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAVE༒KINGS | Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
}

.container{
  width:92%;
  max-width:1100px;
  margin:auto;
}

header{
  padding:25px 0;
  border-bottom:1px solid #292929;
  text-align:center;
}

header h1{color:#ff6a00}

.login,.dashboard{
  max-width:1000px;
  margin:40px auto;
}

.box,.application,.card{
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  padding:25px;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  border-radius:8px;
  border:1px solid #333;
  background:#191919;
  color:#fff;
}

button{
  padding:12px 18px;
  border:0;
  border-radius:8px;
  background:#ff6a00;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.logout{background:#333}

.message{
  margin-top:15px;
  color:#ff8a00;
}

.dashboard{display:none}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.card{
  text-align:center;
}

.card h2{color:#ff6a00}

.applications{
  display:grid;
  gap:18px;
}

.application h3{
  color:#ff8a00;
  margin-bottom:12px;
}

.application p{
  margin:6px 0;
  color:#ccc;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:7px;
  background:#222;
  margin:10px 0;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.approve{background:#16803c}
.reject{background:#a83232}

.screenshot{
  max-width:300px;
  max-height:300px;
  display:block;
  margin-top:15px;
  border-radius:10px;
  border:1px solid #333;
}

.empty{
  text-align:center;
  color:#888;
  padding:30px;
}

@media(max-width:700px){
  .cards{grid-template-columns:1fr}
  .topbar{align-items:stretch}
  .topbar button{width:100%}
}
</style>
</head>

<body>

<header>
  <div class="container">
    <h1>⚔️ BRAVE༒KINGS ADMIN</h1>
  </div>
</header>


<div class="login" id="loginBox">

  <div class="box">

    <h2>Admin Login</h2>

    <br>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Admin email">

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Admin password">

    <button onclick="login()">LOGIN</button>

    <div class="message" id="loginMessage"></div>

  </div>

</div>


<div class="dashboard" id="dashboard">

  <div class="container">

    <div class="topbar">

      <h2>Application Dashboard</h2>

      <div>

        <button onclick="loadApplications()">
          🔄 Refresh
        </button>

        <button class="logout" onclick="logout()">
          Logout
        </button>

      </div>

    </div>


    <div class="cards">

      <div class="card">
        <h2 id="total">0</h2>
        <p>Total</p>
      </div>

      <div class="card">
        <h2 id="pending">0</h2>
        <p>Pending</p>
      </div>

      <div class="card">
        <h2 id="approved">0</h2>
        <p>Approved</p>
      </div>

    </div>


    <div class="applications" id="applications"></div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ================================
   SUPABASE SETTINGS
   ================================ */

const SUPABASE_URL =
"https://enhoicmhdhwksgwlveou.supabase.co/rest/v1/";

const SUPABASE_KEY =
"sb_publishable_FhqemTWZw6K5w-vO6bze8g_-hm117f-";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================================
   LOGIN
   ================================ */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");


  if(!email || !password){

    message.textContent =
      "Please enter your email and password.";

    return;
  }


  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    message.textContent =
      "Login failed. Check your details.";

    return;
  }


  await showDashboard();
}


/* ================================
   ADMIN CHECK
   ================================ */

async function showDashboard(){

  const { data: { user } } =
    await supabaseClient.auth.getUser();


  if(!user){

    await logout();

    return;
  }


  const { data: admin } =
    await supabaseClient
      .from("admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();


  if(!admin){

    alert("You are not authorized as an admin.");

    await logout();

    return;
  }


  document.getElementById("loginBox")
    .style.display = "none";

  document.getElementById("dashboard")
    .style.display = "block";


  await loadApplications();
}


/* ================================
   LOAD APPLICATIONS
   ================================ */

async function loadApplications(){

  const container =
    document.getElementById("applications");


  container.innerHTML =
    "<div class='empty'>Loading applications...</div>";


  const { data, error } =
    await supabaseClient
      .from("applications")
      .select("*")
      .order("created_at", {
        ascending:false
      });


  if(error){

    console.error(error);

    container.innerHTML =
      "<div class='empty'>" +
      "Could not load applications." +
      "</div>";

    return;
  }


  const total = data.length;

  const pending =
    data.filter(
      a => a.status === "Pending"
    ).length;

  const approved =
    data.filter(
      a => a.status === "Approved"
    ).length;


  document.getElementById("total")
    .textContent = total;

  document.getElementById("pending")
    .textContent = pending;

  document.getElementById("approved")
    .textContent = approved;


  if(!data.length){

    container.innerHTML =
      "<div class='empty'>" +
      "No applications yet." +
      "</div>";

    return;
  }


  container.innerHTML = "";


  for(const app of data){

    let screenshotHTML = "";


    /* Generate secure screenshot URL */

    if(app.screenshot_url){

      const { data: signedData, error } =
        await supabaseClient
          .storage
          .from("tryout-screenshots")
          .createSignedUrl(
            app.screenshot_url,
            3600
          );


      if(!error && signedData){

        screenshotHTML = `
          <p><strong>Screenshot:</strong></p>

          <a
            href="${escapeHtml(
              signedData.signedUrl
            )}"
            target="_blank">

            <img
              class="screenshot"
              src="${escapeHtml(
                signedData.signedUrl
              )}"
              alt="Player screenshot">

          </a>
        `;
      }
    }


    const div =
      document.createElement("div");

    div.className = "application";


    div.innerHTML = `

      <h3>
        ⚔️ ${escapeHtml(app.name)}
      </h3>

      <p>
        <strong>Application ID:</strong>
        ${escapeHtml(app.application_id)}
      </p>

      <p>
        <strong>UID:</strong>
        ${escapeHtml(app.uid)}
      </p>

      <p>
        <strong>Contact:</strong>
        ${escapeHtml(app.contact || "N/A")}
      </p>

      <p>
        <strong>Role:</strong>
        ${escapeHtml(app.role || "N/A")}
      </p>

      <p>
        <strong>Reason:</strong>
        ${escapeHtml(app.reason || "N/A")}
      </p>

      <div class="status">
        Status:
        <strong>
          ${escapeHtml(app.status || "Pending")}
        </strong>
      </div>

      ${screenshotHTML}

      <div class="actions">

        <button
          class="approve"
          onclick="updateStatus(
            '${app.id}',
            'Approved'
          )">

          ✅ Approve

        </button>

        <button
          class="reject"
          onclick="updateStatus(
            '${app.id}',
            'Rejected'
          )">

          ❌ Reject

        </button>

      </div>
    `;


    container.appendChild(div);
  }
}


/* ================================
   UPDATE STATUS
   ================================ */

async function updateStatus(id,status){

  const { error } =
    await supabaseClient
      .from("applications")
      .update({
        status:status
      })
      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "Could not update application."
    );

    return;
  }


  await loadApplications();
}


/* ================================
   LOGOUT
   ================================ */

async function logout(){

  await supabaseClient
    .auth
    .signOut();

  location.reload();
}


/* ================================
   HTML SECURITY
   ================================ */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ================================
   EXISTING SESSION
   ================================ */

supabaseClient.auth
  .getSession()
  .then(({data}) => {

    if(data.session){

      showDashboard();

    }

  });

</script>

</body>
</html>
